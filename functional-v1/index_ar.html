<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محسّن زد شب</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;background:#fafafa}
    .card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
    label{display:block;margin-top:10px}
    input{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px}
    button{margin-top:14px;padding:10px 14px;border:0;background:#5b4ce6;color:#fff;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>محسّن زد شب (نسخة عربية)</h1>
    <p>أداة سريعة لتوصية تسعير الشحن وحد الشحن المجاني ورسوم الدفع عند الاستلام.</p>
  </div>

  <div class="card">
    <label>متوسط قيمة الطلب (SAR)<input id="aov" type="number" value="180" /></label>
    <label>تكلفة الشحن الاقتصادي (SAR)<input id="std" type="number" value="22" /></label>
    <label>تكلفة الشحن السريع (SAR)<input id="exp" type="number" value="38" /></label>
    <label>نسبة الدفع عند الاستلام (0-1)<input id="cod" type="number" step="0.01" value="0.35" /></label>
    <button onclick="run()">توليد التوصية</button>
  </div>

  <div class="card" id="out"></div>

  <script>
    function run(){
      const aov=Number(document.getElementById('aov').value||0);
      const std=Number(document.getElementById('std').value||0);
      const exp=Number(document.getElementById('exp').value||0);
      const cod=Number(document.getElementById('cod').value||0);
      const free=(aov*1.35).toFixed(2);
      const stdFee=Math.max(0,std*0.45).toFixed(2);
      const expFee=Math.max(0,exp*0.65).toFixed(2);
      const codFee=cod>0.5?5:(cod>0.3?3:0);
      document.getElementById('out').innerHTML=`
        <h3>نتيجة التوصية</h3>
        <p>• حد الشحن المجاني المقترح: <b>${free} ريال</b></p>
        <p>• رسوم الشحن الاقتصادي على العميل: <b>${stdFee} ريال</b></p>
        <p>• رسوم الشحن السريع على العميل: <b>${expFee} ريال</b></p>
        <p>• رسوم الدفع عند الاستلام المقترحة: <b>${codFee} ريال</b></p>
      `;
    }
    run();
  </script>
</body>
</html>
